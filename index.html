<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mufasa · 个人主页</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="site-header">
    <a class="brand" href="#top">Mufasa</a>
    <nav class="nav">
      <a href="#about">关于</a>
      <a href="#calculator">计算器</a>
    </nav>
  </header>

  <main id="top">
    <section class="hero">
      <p class="hero-brand">Mufasa</p>
      <h1 class="hero-title">用代码把想法变成页面</h1>
      <p class="hero-desc">这是一个纯 HTML / CSS / JS 的个人小站，下面有一个可交互的计算器。</p>
      <div class="hero-actions">
        <a class="btn btn-primary" href="#calculator">算一下</a>
        <a class="btn btn-ghost" href="#about">算个 der</a>
      </div>
    </section>

    <section id="about" class="about">
      <h2>关于我</h2>
      <p>喜欢把界面做得干净好用，也喜欢把逻辑写得清晰可维护。这个站点没有框架，只有浏览器原生技术。</p>
    </section>

    <section id="calculator" class="calculator-section">
      <h2>计算器</h2>
      <p class="section-desc">加减乘除、小数与百分比，逻辑全部由 JavaScript 驱动。</p>

      <div class="calculator" role="application" aria-label="计算器">
        <div class="display">
          <div class="expression" id="expression" aria-live="polite"></div>
          <div class="result" id="result">0</div>
        </div>

        <div class="keys">
          <button type="button" class="key key-fn" data-action="clear">AC</button>
          <button type="button" class="key key-fn" data-action="sign">±</button>
          <button type="button" class="key key-fn" data-action="percent">%</button>
          <button type="button" class="key key-op" data-action="operator" data-value="÷">÷</button>

          <button type="button" class="key" data-action="digit" data-value="7">7</button>
          <button type="button" class="key" data-action="digit" data-value="8">8</button>
          <button type="button" class="key" data-action="digit" data-value="9">9</button>
          <button type="button" class="key key-op" data-action="operator" data-value="×">×</button>

          <button type="button" class="key" data-action="digit" data-value="4">4</button>
          <button type="button" class="key" data-action="digit" data-value="5">5</button>
          <button type="button" class="key" data-action="digit" data-value="6">6</button>
          <button type="button" class="key key-op" data-action="operator" data-value="−">−</button>

          <button type="button" class="key" data-action="digit" data-value="1">1</button>
          <button type="button" class="key" data-action="digit" data-value="2">2</button>
          <button type="button" class="key" data-action="digit" data-value="3">3</button>
          <button type="button" class="key key-op" data-action="operator" data-value="+">+</button>

          <button type="button" class="key key-zero" data-action="digit" data-value="0">0</button>
          <button type="button" class="key" data-action="decimal">.</button>
          <button type="button" class="key key-eq" data-action="equals">=</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>© 2026 Mufasa · Built with HTML, CSS &amp; JS</p>
  </footer>

  <div class="contra-widget" id="contra-widget">
    <button
      type="button"
      class="contra-toggle"
      id="contra-toggle"
      aria-expanded="false"
      aria-controls="contra-panel"
      title="打开魂斗罗"
    >
      <span class="contra-toggle-icon" aria-hidden="true">▶</span>
      <span>魂斗罗</span>
    </button>

    <div class="contra-panel" id="contra-panel" role="dialog" aria-label="魂斗罗小游戏">
      <div class="contra-chrome">
        <span class="contra-title">CONTRA · 魂斗罗</span>
        <button type="button" class="contra-close" id="contra-close" aria-label="关闭游戏">×</button>
      </div>
      <canvas id="contra-canvas" width="320" height="200" tabindex="0"></canvas>
      <p class="contra-hint" id="contra-hint">←→移动  ↑跳  ↓蹲  J射击</p>
    </div>
  </div>

  <script src="script.js"></script>
  <script src="contra.js"></script>
</body>
</html>
